services:

  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: annapurna
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123

    ports:
      - "5432:5432"

    volumes:
      - annapurna_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annapurna -d annapurna"]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:latest
    container_name: annapurna-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - annapurna_minio_data:/data

    command: server /data --console-address ":9001"


volumes:

  annapurna_postgres_data:
    name: annapurna_postgres_data

  annapurna_minio_data:
    name: annapurna_minio_data