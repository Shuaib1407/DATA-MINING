services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123
      POSTGRES_DB: annapurna
    ports:
      - "5432:5432"
    volumes:
      - annapurna_postgres_data:/var/lib/postgresql/data
      - ./masters.sql:/docker-entrypoint-initdb.d/10-masters.sql:ro

  minio:
    image: quay.io/minio/minio
    container_name: annapurna-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - annapurna_minio_data:/data

volumes:
  annapurna_postgres_data:
  annapurna_minio_data:
